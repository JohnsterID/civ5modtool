[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civ5modtool"
dynamic = ["version"]
description = "Read, convert, check and edit Civilization V mod files (.modinfo, .civ5proj, .civ5sln)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "JohnsterID" }]
keywords = ["civilization-v", "civ5", "modding", "modinfo", "modbuddy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment",
]
dependencies = []  # standard library only; the GUI uses Tkinter, which ships with Python

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
modtools = "modtools.__main__:main"

[project.urls]
Homepage = "https://github.com/JohnsterID/civ5modtool"

[tool.setuptools.dynamic]
version = { attr = "modtools.__version__" }

[tool.setuptools.packages.find]
include = ["modtools*"]
